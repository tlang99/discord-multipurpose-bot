name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request, focusing on:
            - Correctness and potential bugs
            - Security implications (this is a Discord moderation bot - pay particular
              attention to anything touching permission checks, token/secret handling,
              or user-supplied input)
            - Code quality and maintainability
            - Whether it fits the existing architecture described in README.md (slash
              commands auto-discovered under Modules/, business logic kept in Services/
              behind interfaces, gateway event handlers under EventHandlers/)

            The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for overall feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for comments on specific lines.
            Only post GitHub comments - don't just print review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  review-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            COMMIT: ${{ github.sha }}
            BEFORE: ${{ github.event.before }}

            This was pushed directly to main, not through a pull request. Diff the
            pushed changes against BEFORE (use `git diff BEFORE COMMIT`; if BEFORE is
            all zeros, this is the branch's first commit, so just review COMMIT itself)
            and review for:
            - Correctness and potential bugs
            - Security implications (this is a Discord moderation bot - pay particular
              attention to anything touching permission checks, token/secret handling,
              or user-supplied input)
            - Code quality and maintainability

            Post your findings as a commit comment:
              gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="<your review, in markdown>"
            If you find nothing worth flagging, still post a short comment saying so.
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh api:*)"
