name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Discord.Net 3.20.2 plus the readable voice fix in discord-net-patch/pr3288.patch, built from the official
      # source at a pinned commit (see build.ps1). Built here rather than committed, so every binary is reviewable.
      - name: Build patched Discord.Net
        run: pwsh -File discord-net-patch/build.ps1

      - name: Build
        run: dotnet build ModBot.csproj --configuration Release

      - name: Test
        run: dotnet test tests/ModBot.Tests --configuration Release
